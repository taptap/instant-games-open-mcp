<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Maker UI 动效</title>
  <link rel="stylesheet" href="player.css">
  <script>(function(){var apply=function(t){if(t==='light'||t==='dark')document.documentElement.dataset.theme=t};try{var h=window.parent!==window&&window.parent.location.origin===location.origin&&window.parent.MakerConsole;if(h){apply(h.getTheme());var u=h.onThemeChange(apply);window.addEventListener('pagehide',function(){u()});return}}catch(_){}try{apply(localStorage.getItem('maker-console-theme')||'dark');window.addEventListener('storage',function(e){if(e.key==='maker-console-theme'||e.key===null)apply(e.newValue||'dark')})}catch(_){}})();</script>
</head>
<body class="loading">
  <main>
    <div class="stage-space"><div class="viewport">
      <canvas id="stage" width="1280" height="720" tabindex="0" aria-label="分层 UI 演示，空格暂停，左右逐帧"></canvas>
      <div id="actions" class="hotspots" aria-label="界面交互"></div>
      <output id="toast" class="toast" role="status" hidden></output>
      <div id="loading" class="loading-panel" role="status"><span id="loading-text">正在准备演示…</span><button id="retry" hidden>重新加载</button></div>
    </div></div>
    <div class="controls">
      <button id="play" aria-pressed="false" disabled>播放</button>
      <button id="replay" disabled>重播</button>
      <output id="time"></output>
      <select id="speed" aria-label="播放速度"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select>
    </div>
    <div id="timeline" class="timeline" aria-label="动画关键帧，左右方向键逐帧"><div id="markers"></div><div id="playhead" aria-hidden="true"></div></div>
    <p id="status" role="status">正在加载独立素材…</p>
  </main>
  <script src="player.js" defer></script>
</body>
</html>

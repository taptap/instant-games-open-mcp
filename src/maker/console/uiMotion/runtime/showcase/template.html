<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NanoVG · UI 动效</title><style>:root{color-scheme:dark;--ink:#fff0cf;--muted:#a4bdb2;--line:#36554f;--accent:#e79062;--panel:#102f32;--track:#25443f}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0,#224c49,transparent 65%),#0c2429;color:var(--ink);font:14px/1.5 Georgia,"Noto Serif SC",serif}main{max-width:1440px;margin:auto;padding:18px clamp(12px,3vw,36px)}header{display:flex;justify-content:space-between;gap:12px;align-items:center}h1{font-size:20px;font-weight:500;margin:0}small,.muted{color:var(--muted);font-size:12px}button,select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:5px;min-height:38px;padding:6px 12px;cursor:pointer}button:hover,select:hover{border-color:var(--accent)}button[aria-pressed=true]{border-color:var(--accent);color:#ffd3a1}button:focus-visible,a:focus-visible,select:focus-visible,[role=slider]:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button:disabled{opacity:.45;cursor:default}.scene-nav,.controls,.touch-actions{display:flex;flex-wrap:wrap;gap:8px}.scene-nav{margin:14px 0}.stage{position:relative;aspect-ratio:16/9;background:#103d41;overflow:hidden;box-shadow:0 18px 55px #0004}canvas,.hits,.reference{position:absolute;inset:0;width:100%;height:100%}.reference{object-fit:contain;z-index:20}.hits button{position:absolute;padding:0;border:0;background:transparent;color:transparent;min-height:0;border-radius:0;transform-origin:top left;touch-action:manipulation}.hits button:disabled{pointer-events:none}.controls{margin:16px 0 10px;align-items:center}.controls select{max-width:min(250px,100%)}.controls .spacer{flex:1}.controls output{font:12px/1.5 ui-monospace,monospace;color:var(--muted)}.timeline{border:1px solid var(--line);border-radius:7px;background:#0f292c;overflow:hidden}.timeline-head{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--line);gap:10px}.timeline-head strong{font-size:13px;font-weight:500}.timeline-head button{min-height:28px;padding:2px 8px;font-size:12px}.timeline-body{padding:8px 17px 6px 12px}.ruler-row,.track-row{display:grid;grid-template-columns:116px minmax(0,1fr);align-items:center;min-height:31px}.track-name{font-size:12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding-right:10px}.ruler{height:26px;position:relative}.tick{position:absolute;top:0;transform:translateX(-50%);font:10px ui-monospace,monospace;color:var(--muted)}.tick:first-child{transform:none}.tick:last-child{transform:translateX(-100%)}.tick:after{content:'';position:absolute;left:50%;top:15px;height:5px;border-left:1px solid var(--line)}.lane{height:30px;position:relative;touch-action:manipulation;cursor:crosshair}.lane:before{content:'';position:absolute;top:15px;left:0;right:0;border-top:1px solid #34534b}.segment{position:absolute;top:12px;height:7px;background:#4b7262;border-radius:2px;pointer-events:none}.keyframe{position:absolute;top:2px;width:27px;height:27px;min-height:0;padding:0;transform:translateX(-50%);border:0;background:transparent;z-index:3}.keyframe:after{content:'';display:block;width:8px;height:8px;transform:rotate(45deg);background:#e3bb79;border:1px solid #ffe0ad;margin:auto}.keyframe[aria-pressed=true]:after{background:#fff0cf;box-shadow:0 0 0 2px #e7906266}.playhead{position:absolute;top:-3px;bottom:-2px;left:0;border-left:1px solid #ed9163;z-index:2;pointer-events:none}.playhead:before{content:'';position:absolute;width:5px;height:5px;left:-3px;top:0;background:#ed9163;transform:rotate(45deg)}.timeline-detail{margin:0;padding:9px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);min-height:36px}.note{font-size:12px;color:var(--muted);margin-top:12px}.touch-actions{display:none;margin-top:12px}.touch-actions button{flex:1 1 28%;font-size:12px;padding:5px}.asset-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.asset-grid img{width:100%;height:240px;object-fit:contain;background:repeating-conic-gradient(#82948c 0 25%,#a5b5ad 0 50%) 0/20px 20px}.asset-grid figure{margin:0}.asset-grid figcaption{color:var(--muted);font-size:12px}dialog{color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:9px;max-width:min(92vw,960px);max-height:90dvh;overflow:auto;padding:20px}dialog::backdrop{background:#00151ac9}dialog header{margin-bottom:16px}[hidden]{display:none!important}.thumbnail main{padding:0}.thumbnail header,.thumbnail nav,.thumbnail .controls,.thumbnail .timeline,.thumbnail .note,.thumbnail .touch-actions{display:none}.thumbnail .stage{box-shadow:none}
@media(max-width:600px){main{padding-top:12px}h1{font-size:17px}header small{display:none}.scene-nav{gap:5px}.scene-nav button{font-size:12px;padding:6px 8px;flex:1}.controls{gap:6px}.controls button,.controls select{font-size:12px;padding:6px 8px}.controls .spacer{display:none}.controls output{margin-left:auto}.ruler-row,.track-row{grid-template-columns:80px minmax(0,1fr)}.timeline-body{padding-left:9px}.track-name{font-size:11px}.timeline-head{padding:8px}.timeline-detail{font-size:11px}.touch-actions{display:flex}.asset-grid{grid-template-columns:1fr}dialog{padding:12px}.asset-grid img{height:200px}}

.embedded main{height:100dvh;max-width:none;padding:12px 16px;display:grid;grid-template-rows:auto minmax(140px,1fr) auto minmax(110px,auto) auto;gap:10px}
.embedded main>header{display:none}
.embedded .scene-nav,.embedded .controls,.embedded .touch-actions,.embedded .note{margin:0}
.embedded .stage-space{min-height:140px;container-type:size;display:grid;place-items:center}
.embedded .stage{width:min(100cqw,calc(100cqh * 16 / 9));aspect-ratio:16/9}
.embedded .timeline{display:flex;flex-direction:column;min-height:110px;max-height:min(250px,34dvh)}
.embedded .timeline-head,.embedded .timeline-detail{flex:none}
.embedded .timeline-body{min-height:0;overflow-y:auto;overscroll-behavior:contain}
.embedded .note{font-size:11px}
.embedded .touch-actions{display:none}
@media(max-width:600px){.embedded main{padding:10px;gap:8px}.embedded .scene-nav button{flex:1 1 28%}.embedded .timeline{max-height:30dvh}.embedded .controls select{max-width:100%;flex-basis:100%}}
@media(max-height:480px){.embedded main{height:auto;min-height:100dvh}.embedded .stage-space{height:clamp(140px,50dvh,300px)}.embedded .timeline{max-height:180px}}
</style></head><body><main><header><h1 id="heading">NanoVG · UI 动效</h1><small>独立 PNG / 矢量界面</small></header><nav id="scene-nav" class="scene-nav" aria-label="界面"></nav><div class="stage-space"><div class="stage"><canvas id="screen" width="1280" height="720" aria-label="UI 动效绘制预览"></canvas><div id="hits" class="hits"></div><img id="reference" class="reference" alt="认可的 V1 设计稿" hidden></div></div><div id="touch-actions" class="touch-actions" aria-label="界面快捷操作"></div><div class="controls"><select id="animation" aria-label="动效片段"></select><button id="replay">重播</button><button id="play" aria-pressed="false">播放</button><button id="prev" aria-label="上一帧">← 帧</button><button id="next" aria-label="下一帧">帧 →</button><button id="ready" hidden>返回交互</button><span class="spacer"></span><button id="compare" aria-pressed="false">设计稿</button><button id="assets">独立素材</button><output id="time"></output></div><section class="timeline" aria-label="动效关键帧时间轴"><div class="timeline-head"><strong id="clip-name"></strong><button id="unit">秒 → 帧</button></div><div id="timeline-body" class="timeline-body"></div><p id="key-detail" class="timeline-detail"></p></section><p class="note">此页由原版 LuaTween + Lua 配方驱动，Canvas 2D 只绘图；游戏入口 NanoVGShowcaseMain.lua 使用同一配方与原生 NanoVG。</p></main><dialog id="asset-dialog"><header><h1>独立 PNG 素材</h1><button id="close-assets">关闭</button></header><div id="asset-grid" class="asset-grid"></div></dialog>__SCRIPTS__</body></html>

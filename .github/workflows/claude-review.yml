name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]

jobs:
  review:
    # Maker/release automation PRs are covered by dedicated CI guards; manual @claude
    # comments can still request a review when needed.
    if: |
      (github.event_name == 'pull_request' &&
       !contains(github.event.pull_request.title, '(maker)') &&
       !contains(github.event.pull_request.title, '(release)') &&
       !startsWith(github.event.pull_request.title, 'ci(maker):') &&
       !startsWith(github.event.pull_request.title, 'ci(release):')) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check review model connectivity
        timeout-minutes: 2
        env:
          ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          node --input-type=module <<'NODE'
          const key = process.env.ANTHROPIC_API_KEY;
          const base = process.env.ANTHROPIC_BASE_URL || 'https://api.anthropic.com';
          try {
            const response = await fetch(base.replace(/\/$/, '') + '/v1/messages', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01' },
              body: JSON.stringify({ model: 'claude-opus-5', max_tokens: 16, messages: [{ role: 'user', content: 'Reply OK.' }] }),
              signal: AbortSignal.timeout(60000),
            });
            const result = await response.json();
            const message = String(result.error?.message || '').split(key).join('[REDACTED]').slice(0, 800);
            console.log(JSON.stringify({ status: response.status, model: result.model, errorType: result.error?.type, message }));
            if (!response.ok || result.type !== 'message') process.exitCode = 1;
          } catch (error) {
            console.error('Review API connectivity check failed: ' + error.name);
            process.exitCode = 1;
          }
          NODE

      - uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          use_sticky_comment: true
          claude_args: |
            --model claude-opus-5
            --effort medium
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(cat:*),Bash(grep:*),Bash(git diff:*),Bash(git log:*),Read,Glob,Grep"
          prompt: |
            Read CLAUDE.md for project conventions, then review this PR following docs/CODE_REVIEW.md
            for methodology, checklist, and output format.
            Focus on production-code correctness and concrete regressions. Inspect generated preset
            and CDN manifests selectively; do not dump large single-line JSON or binary assets.
            Use `gh pr diff` to get changes, verify findings with actual code before reporting.
            Post ONE PR comment using `gh pr comment` with the exact output format from docs/CODE_REVIEW.md.
            For 阻塞问题 and 警告, also add inline comments via
            `mcp__github_inline_comment__create_inline_comment` with `confirmed: true`.

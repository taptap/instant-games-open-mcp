name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]

jobs:
  review:
    # Maker/release automation PRs are covered by dedicated CI guards; manual @claude
    # comments can still request a review when needed.
    if: |
      (github.event_name == 'pull_request' &&
       !contains(github.event.pull_request.title, '(maker)') &&
       !contains(github.event.pull_request.title, '(release)') &&
       !startsWith(github.event.pull_request.title, 'ci(maker):') &&
       !startsWith(github.event.pull_request.title, 'ci(release):')) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        id: claude
        env:
          ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          use_sticky_comment: true
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(cat:*),Bash(grep:*),Bash(git diff:*),Bash(git log:*),Read,Glob,Grep"
          prompt: |
            Read CLAUDE.md for project conventions, then review this PR following docs/CODE_REVIEW.md
            for methodology, checklist, and output format.
            Use `gh pr diff` to get changes, verify findings with actual code before reporting.
            Post ONE PR comment using `gh pr comment` with the exact output format from docs/CODE_REVIEW.md.
            For 阻塞问题 and 警告, also add inline comments via
            `mcp__github_inline_comment__create_inline_comment` with `confirmed: true`.

      - name: Report Claude failure category
        if: failure() && steps.claude.outcome == 'failure'
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re
          path = pathlib.Path(os.environ.get('EXECUTION_FILE') or '/home/runner/work/_temp/claude-execution-output.json')
          if not path.is_file():
              print('Claude execution diagnostics unavailable')
              raise SystemExit(0)
          raw = path.read_text()
          try:
              records = json.loads(raw)
          except ValueError:
              records = []
              for line in raw.splitlines():
                  try:
                      records.append(json.loads(line))
                  except ValueError:
                      pass
          # Never print conversation text, tool output, credentials, or raw API responses.
          signals = ['authentication_error', 'permission_error', 'not_found_error',
                     'invalid_request_error', 'rate_limit_error', 'overloaded_error',
                     'api_error', 'model_not_found', 'insufficient_quota', 'billing_error']
          found = sorted({signal for signal in signals if re.search(r'\b' + signal + r'\b', raw)})
          for label, pattern in [
              ('model_unavailable', r'model.{0,120}(not found|not available|not supported|does not exist)'),
              ('credentials_rejected', r'(invalid|expired).{0,30}(api.key|token|credential)'),
              ('network_error', r'ECONNREFUSED|ETIMEDOUT|ENOTFOUND|connection error'),
          ]:
              if re.search(pattern, raw, re.I):
                  found.append(label)
          print('Claude failure categories: ' + (', '.join(found) or 'unspecified'))
          def visit(value):
              if isinstance(value, dict):
                  status = value.get('status_code', value.get('status'))
                  if isinstance(status, int) and 400 <= status <= 599:
                      print('Claude HTTP status: ' + str(status))
                  for item in value.values():
                      visit(item)
              elif isinstance(value, list):
                  for item in value:
                      visit(item)
          visit(records)
          PY
